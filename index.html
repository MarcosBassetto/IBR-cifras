    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBXssz_sR3XqrpFFPOZJhOVzxfV8YO1CPM",
            authDomain: "ibr---cirfras.firebaseapp.com",
            projectId: "ibr---cirfras",
            storageBucket: "ibr---cirfras.firebasestorage.app",
            messagingSenderId: "513023714971",
            appId: "1:513023714971:web:768cd8cd05c7e8bba0083e"

        console.log('🔥 Firebase conectado!');

    <!-- ========================================= -->
    <!-- ===== SCRIPT DE MIGRAÇÃO ===== -->
    <!-- ========================================= -->
    <script>
        // ===== FUNÇÕES DE MIGRAÇÃO DIRETAS (sem depender de arquivo externo) =====

        // 1. Ler dados do IndexedDB
        function listarDoIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('CifrasDB', 1);
                request.onsuccess = (e) => {
                    const db = e.target.result;
                    const tx = db.transaction('cifras', 'readonly');
                    const store = tx.objectStore('cifras');
                    const req = store.getAll();
                    req.onsuccess = () => {
                        console.log('📋 Cifras lidas do IndexedDB:', req.result.length);
                        resolve(req.result);
                    };
                    req.onerror = () => {
                        console.error('❌ Erro ao ler IndexedDB:', req.error);
                        reject(req.error);
                    };
                };
                request.onerror = () => {
                    console.error('❌ Erro ao abrir IndexedDB:', request.error);
                    reject(request.error);
                };
            });
        }

        // 2. Função de migração
        async function migrarDados() {
            try {
                const cifras = await listarDoIndexedDB();
                if (cifras.length === 0) {
                    alert('Nenhuma cifra encontrada no IndexedDB para migrar.');
                    return;
                }

                if (!confirm(`Deseja migrar ${cifras.length} cifras para o Firebase Firestore?`)) {
                    return;
                }

                let sucessos = 0;
                let erros = 0;

                for (const cifra of cifras) {
                    try {
                        const { id, ...dadosSemId } = cifra;
                        await db.collection('cifras').add(dadosSemId);
                        sucessos++;
                        console.log(`✅ Migrada: ${cifra.nome}`);
                    } catch (error) {
                        erros++;
                        console.error(`❌ Erro ao migrar "${cifra.nome}":`, error);
                    }
                }

                alert(`Migração concluída!\nSucessos: ${sucessos}\nErros: ${erros}`);
                // Recarregar a página para mostrar os dados do Firestore
                location.reload();
            } catch (error) {
                console.error('Erro na migração:', error);
                alert('Erro ao migrar dados. Veja o console para detalhes.');
            }
        }

        // 3. Associar o botão fixo à função de migração
        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('btn-migrar-firebase');
            if (btn) {
                btn.addEventListener('click', migrarDados);
            }
        });
    </script>
